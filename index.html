<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Muscle Atlas" />
  <meta name="description" content="Human Muscle Atlas & Nerve Supply Quiz for clinical students" />

  <!-- Inline manifest via data URI for true single-file PWA -->

  <!-- Apple touch icon (brain emoji SVG) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23131621'/><text x='256' y='340' text-anchor='middle' font-size='300'>🧠</text></svg>" />

  <title>Human Muscle Atlas</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; overflow: hidden; }
    body { background: #0F1117; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    /* iOS safe-area padding */
    #root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

    /* Install banner */
    #install-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: linear-gradient(135deg, #1A1D27, #22253A);
      border-bottom: 1px solid #9B89C455;
      padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
      transform: translateY(-100%);
      transition: transform 0.35s cubic-bezier(.4,0,.2,1);
      padding-top: calc(10px + env(safe-area-inset-top));
    }
    #install-banner.visible { transform: translateY(0); }
    #install-banner .icon { font-size: 24px; flex-shrink: 0; }
    #install-banner .text { flex: 1; }
    #install-banner .text strong { display: block; font-size: 13px; color: #E8ECF0; }
    #install-banner .text span { font-size: 11px; color: #7A8BAA; }
    #install-banner button {
      border: none; border-radius: 8px; padding: 6px 12px;
      font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    #install-btn { background: #9B89C4; color: #fff; }
    #dismiss-btn { background: transparent; color: #7A8BAA; font-size: 18px; padding: 4px 8px; }

    /* iOS "Add to Home Screen" hint */
    #ios-hint {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #22253A; border: 1px solid #9B89C455; border-radius: 14px;
      padding: 12px 16px; z-index: 9999; max-width: 300px; width: 90%;
      opacity: 0; transition: all 0.35s; pointer-events: none; text-align: center;
    }
    #ios-hint.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    #ios-hint p { font-size: 12px; color: #C0CAD8; line-height: 1.6; }
    #ios-hint strong { color: #9B89C4; }
    #ios-hint .close-hint {
      margin-top: 10px; background: none; border: 1px solid #2A2E45;
      border-radius: 8px; padding: 5px 14px; color: #7A8BAA; font-size: 11px; cursor: pointer;
    }

    /* Offline toast */
    #offline-toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: #E88080; color: #fff; border-radius: 20px;
      padding: 6px 16px; font-size: 12px; font-weight: 700;
      z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    #offline-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Online toast */
    #online-toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: #85C18A; color: #fff; border-radius: 20px;
      padding: 6px 16px; font-size: 12px; font-weight: 700;
      z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    #online-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Scrollbar hide */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>

<!-- Install prompt (Android/Chrome) -->
<div id="install-banner">
  <span class="icon">🧠</span>
  <div class="text">
    <strong>Install Muscle Atlas</strong>
    <span>Works offline · No app store needed</span>
  </div>
  <button id="install-btn">Install</button>
  <button id="dismiss-btn">✕</button>
</div>

<!-- iOS hint -->
<div id="ios-hint">
  <p>To install on iPhone:<br>Tap the <strong>Share ⬆</strong> button below,<br>then tap <strong>Add to Home Screen</strong></p>
  <button class="close-hint" id="close-ios-hint">Got it</button>
</div>

<!-- Offline/Online toasts -->
<div id="offline-toast">📵 You're offline — Atlas still works!</div>
<div id="online-toast">✅ Back online</div>

<div id="root"></div>

<!-- React + Babel via CDN -->

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── DATA ────────────────────────────────────────────────────────────────────

const regionColors = {

  "Thorax": "#7EB8C9",
  "Abdomen": "#85C18A",
  "Pelvis": "#85C18A",
};

const regions = [
  {
    id: "head", label: "Head & Neck", color: "#E8A87C", accent: "#C4714A", icon: "🧠",
    groups: [
      { name: "Facial Expression", nerve: "CN VII — Facial nerve", muscles: ["Frontalis", "Orbicularis oculi", "Zygomaticus", "Orbicularis oris", "Buccinator", "Platysma"] },
      { name: "Mastication", nerve: "CN V3 — Mandibular", muscles: ["Temporalis", "Masseter", "Medial pterygoid", "Lateral pterygoid"] },
      { name: "Extraocular", nerve: "CN III / IV / VI", muscles: ["Superior rectus (III)", "Inferior rectus (III)", "Medial rectus (III)", "Inferior oblique (III)", "Superior oblique (IV)", "Lateral rectus (VI)"] },
      { name: "Tongue", nerve: "CN XII — Hypoglossal", muscles: ["Genioglossus", "Hyoglossus", "Styloglossus", "Palatoglossus (CN X)"] },
      { name: "Neck — Anterior", nerve: "CN XI / Ansa cervicalis", muscles: ["Sternocleidomastoid (XI)", "Trapezius (XI)", "Infrahyoids (C1–C3)", "Scalenes (C3–C8)"] },

      { name: "Diaphragm", nerve: "Phrenic nerve C3–C5", muscles: ["Diaphragm"], highlight: true },
      { name: "Deep Back (Intrinsic)", nerve: "Dorsal rami (segmental)", muscles: ["Erector spinae group", "Multifidus", "Semispinalis", "Rotatores", "Splenius capitis/cervicis", "Suboccipital group (C1 dorsal ramus)"] },

  {

    groups: [
      { name: "Shoulder & Cuff", nerve: "Axillary / Suprascapular", muscles: ["Deltoid (Axillary C5–6)", "Supraspinatus (Suprascapular C5–6)", "Infraspinatus (Suprascapular C5–6)", "Teres minor (Axillary C5–6)", "Subscapularis (Subscapular C5–6)"] },

      { name: "Forearm Extensors", nerve: "Radial / PIN", muscles: ["Brachioradialis, ECRL/B (Radial)", "EDC, ECU, Supinator, APL, EPL/B (PIN)"] },

      { name: "Leg — Anterior & Lateral", nerve: "Deep / Superficial fibular", muscles: ["Tibialis anterior, EHL, EDL (Deep fibular L4–S1)", "Fibularis longus & brevis (Superficial fibular L5–S1)"] },
      { name: "Leg — Posterior", nerve: "Tibial nerve S1–S2", muscles: ["Gastrocnemius", "Soleus", "Plantaris", "Popliteus, FHL, FDL, Tibialis posterior (L4–S1)"] },
      { name: "Foot Intrinsics", nerve: "Medial / Lateral plantar", muscles: ["Lumbrical 1, FHB (Medial plantar L5–S1)", "All others: Lateral plantar (S2–S3)", "EDB, EHB (Deep fibular L5–S1)"], highlight: true },
    ],
  },

const mnemonics = [
  { text: "C3, C4, C5 — keeps the diaphragm alive", icon: "🫁" },
  { text: "LOAF = Median nerve: Lumbricals 1&2, Opponens, Abductor pollicis brevis, Flexor pollicis brevis", icon: "✋" },
  { text: "All other hand intrinsics = Ulnar nerve", icon: "🤏" },
  { text: "Femoral = anterior thigh | Obturator = medial thigh | Sciatic = posterior thigh + below knee", icon: "🦵" },
  { text: '"Tuesday At Noon, Medics Relax" — Tibial, Axillary, Nerve to subclavius, Musculocutaneous, Radial (terminal branches of brachial plexus in order)', icon: "💡" },

const questionBank = [
  { muscle: "Deltoid", answer: "Axillary nerve (C5–C6)", region: "Upper Limb", options: ["Axillary nerve (C5–C6)", "Suprascapular nerve (C5–C6)", "Radial nerve (C6–C8)", "Musculocutaneous nerve (C5–C7)"] },
  { muscle: "Biceps brachii", answer: "Musculocutaneous nerve (C5–C7)", region: "Upper Limb", options: ["Radial nerve (C5–C8)", "Musculocutaneous nerve (C5–C7)", "Median nerve (C6–C8)", "Axillary nerve (C5–C6)"] },
  { muscle: "Triceps brachii", answer: "Radial nerve (C6–C8)", region: "Upper Limb", options: ["Musculocutaneous nerve (C5–C7)", "Ulnar nerve (C7–T1)", "Radial nerve (C6–C8)", "Median nerve (C6–C8)"] },
  { muscle: "Diaphragm", answer: "Phrenic nerve (C3–C5)", region: "Thorax", options: ["Phrenic nerve (C3–C5)", "Vagus nerve (CN X)", "Intercostal nerves T6–T9", "Thoracodorsal nerve (C6–C8)"] },
  { muscle: "Serratus anterior", answer: "Long thoracic nerve (C5–C7)", region: "Thorax", options: ["Thoracodorsal nerve (C6–C8)", "Intercostal nerves T1–T6", "Long thoracic nerve (C5–C7)", "Medial pectoral nerve (C8–T1)"] },
  { muscle: "Gluteus maximus", answer: "Inferior gluteal nerve (L5–S2)", region: "Lower Limb", options: ["Superior gluteal nerve (L4–S1)", "Inferior gluteal nerve (L5–S2)", "Obturator nerve (L2–L4)", "Sciatic nerve (L4–S3)"] },
  { muscle: "Gluteus medius", answer: "Superior gluteal nerve (L4–S1)", region: "Lower Limb", options: ["Inferior gluteal nerve (L5–S2)", "Obturator nerve (L2–L4)", "Superior gluteal nerve (L4–S1)", "Femoral nerve (L2–L4)"] },
  { muscle: "Quadriceps femoris", answer: "Femoral nerve (L2–L4)", region: "Lower Limb", options: ["Obturator nerve (L2–L4)", "Femoral nerve (L2–L4)", "Superior gluteal nerve (L4–S1)", "Sciatic nerve (L4–S3)"] },
  { muscle: "Adductor longus", answer: "Obturator nerve (L2–L4)", region: "Lower Limb", options: ["Femoral nerve (L2–L4)", "Sciatic nerve (L4–S3)", "Obturator nerve (L2–L4)", "Tibial nerve (L4–S3)"] },
  { muscle: "Gastrocnemius", answer: "Tibial nerve (S1–S2)", region: "Lower Limb", options: ["Tibial nerve (S1–S2)", "Common fibular nerve (L4–S2)", "Sural nerve (S1–S2)", "Deep fibular nerve (L4–S1)"] },
  { muscle: "Tibialis anterior", answer: "Deep fibular nerve (L4–S1)", region: "Lower Limb", options: ["Superficial fibular nerve (L5–S1)", "Tibial nerve (L4–S1)", "Deep fibular nerve (L4–S1)", "Common fibular nerve (L4–S2)"] },
  { muscle: "Abductor pollicis brevis", answer: "Median nerve — recurrent branch (C8–T1)", region: "Upper Limb", options: ["Ulnar nerve deep branch (C8–T1)", "Median nerve — recurrent branch (C8–T1)", "Radial nerve (C7–C8)", "Anterior interosseous nerve (C8–T1)"] },
  { muscle: "Flexor digitorum superficialis", answer: "Median nerve (C7–C8)", region: "Upper Limb", options: ["Ulnar nerve (C7–T1)", "Median nerve (C7–C8)", "Anterior interosseous nerve (C8–T1)", "Radial nerve (C6–C8)"] },

  { muscle: "Masseter", answer: "CN V3 — Mandibular division", region: "Head & Neck", options: ["CN VII — Facial nerve", "CN V3 — Mandibular division", "CN IX — Glossopharyngeal", "CN X — Vagus nerve"] },
  { muscle: "Orbicularis oculi", answer: "CN VII — Facial nerve", region: "Head & Neck", options: ["CN V1 — Ophthalmic division", "CN III — Oculomotor nerve", "CN VII — Facial nerve", "CN VI — Abducens nerve"] },
  { muscle: "Sternocleidomastoid", answer: "CN XI — Accessory nerve + C2", region: "Head & Neck", options: ["CN XII — Hypoglossal nerve", "CN X — Vagus nerve", "CN XI — Accessory nerve + C2", "Ansa cervicalis (C1–C3)"] },
  { muscle: "Rectus abdominis", answer: "Intercostal nerves T7–T12", region: "Abdomen", options: ["Iliohypogastric nerve (L1)", "Intercostal nerves T7–T12", "Ilioinguinal nerve (L1)", "Subcostal nerve (T12)"] },

  { muscle: "Levator ani", answer: "Pudendal nerve (S2–S4) + direct S3–S4 branches", region: "Pelvis", options: ["Obturator nerve (L2–L4)", "Pudendal nerve (S2–S4) + direct S3–S4 branches", "Inferior gluteal nerve (L5–S2)", "Sciatic nerve (L4–S3)"] },

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

// ─── ATLAS ────────────────────────────────────────────────────────────────────

function Atlas() {
  const [active, setActive] = useState("head");
  const region = regions.find((r) => r.id === active);

  return (
    <div style={{ background: "#0F1117", minHeight: "100%", color: "#E8ECF0" }}>
      <div style={{ background: "linear-gradient(135deg, #1A1D27 0%, #22253A 100%)", borderBottom: "1px solid #2A2E45", padding: "20px 20px 16px" }}>
        <div style={{ fontSize: 10, letterSpacing: "0.18em", color: "#7A8BAA", textTransform: "uppercase", marginBottom: 4 }}>Clinical Reference</div>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 800, letterSpacing: "-0.02em", color: "#FFFFFF" }}>
          Human Muscle <span style={{ color: region.color }}>Atlas</span>
        </h1>
        <p style={{ margin: "4px 0 0", fontSize: 12, color: "#7A8BAA" }}>Location · Nerve Supply · Key Mnemonics</p>
      </div>

      <div style={{ display: "flex", gap: 8, padding: "14px 16px", overflowX: "auto", background: "#13161F", scrollbarWidth: "none" }}>
        {regions.map((r) => (
          <button key={r.id} onClick={() => setActive(r.id)} style={{ flexShrink: 0, padding: "7px 14px", borderRadius: 20, border: active === r.id ? `2px solid ${r.color}` : "2px solid #2A2E45", background: active === r.id ? `${r.color}22` : "#1A1D27", color: active === r.id ? r.color : "#7A8BAA", fontSize: 12, fontWeight: active === r.id ? 700 : 500, cursor: "pointer", display: "flex", alignItems: "center", gap: 5, transition: "all 0.2s" }}>
            <span>{r.icon}</span><span>{r.label}</span>
          </button>
        ))}
      </div>

      <div style={{ padding: "18px 16px 8px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <div style={{ width: 4, height: 32, borderRadius: 2, background: region.color }} />
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, color: "#FFFFFF" }}>{region.icon} {region.label}</div>
            <div style={{ fontSize: 11, color: "#7A8BAA", marginTop: 2 }}>{region.groups.length} muscle groups</div>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {region.groups.map((g, i) => (
            <div key={i} style={{ background: g.highlight ? `${region.color}14` : "#1A1D27", border: g.highlight ? `1px solid ${region.color}55` : "1px solid #2A2E45", borderRadius: 12, padding: "13px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#FFFFFF" }}>{g.name}</div>
                {g.highlight && <span style={{ fontSize: 9, letterSpacing: "0.1em", background: `${region.color}33`, color: region.color, padding: "2px 7px", borderRadius: 10, textTransform: "uppercase", fontWeight: 700 }}>High yield</span>}
              </div>
              <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: `${region.accent}22`, border: `1px solid ${region.accent}55`, borderRadius: 6, padding: "3px 9px", marginBottom: 10 }}>
                <span style={{ fontSize: 9, color: region.accent, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>Nerve</span>
                <span style={{ fontSize: 11, color: "#D0D8E8", fontWeight: 600 }}>{g.nerve}</span>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                {g.muscles.map((m, j) => (
                  <span key={j} style={{ fontSize: 11, background: "#0F1117", border: "1px solid #2A2E45", borderRadius: 6, padding: "3px 8px", color: "#C0CAD8" }}>{m}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding: "16px 16px 24px" }}>
        <div style={{ fontSize: 10, letterSpacing: "0.16em", color: "#7A8BAA", textTransform: "uppercase", marginBottom: 10 }}>🧩 Key Mnemonics</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
          {mnemonics.map((m, i) => (
            <div key={i} style={{ background: "#1A1D27", border: "1px solid #2A2E45", borderRadius: 10, padding: "10px 13px", display: "flex", gap: 9, alignItems: "flex-start" }}>
              <span style={{ fontSize: 15, flexShrink: 0 }}>{m.icon}</span>
              <span style={{ fontSize: 11, color: "#C0CAD8", lineHeight: 1.5 }}>{m.text}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ textAlign: "center", padding: "0 20px 16px", fontSize: 10, color: "#3A4155" }}>
        Cross-reference with BNF / Katzung before clinical use
      </div>
    </div>
  );
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────

function Quiz() {
  const [mode, setMode] = useState("home");
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [score, setScore] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showFeedback, setShowFeedback] = useState(false);
  const [typedAnswer, setTypedAnswer] = useState("");
  const [aiFeedback, setAiFeedback] = useState(null);
  const [loadingAI, setLoadingAI] = useState(false);
  const [answers, setAnswers] = useState([]);

  function startQuiz(type) {
    const shuffled = shuffle(questionBank).slice(0, 10);
    setQuestions(shuffled);
    setCurrent(0); setScore(0); setSelected(null);
    setShowFeedback(false); setTypedAnswer(""); setAiFeedback(null); setAnswers([]);
    setMode(type);
  }

  function handleMCQ(option) {
    if (showFeedback) return;
    setSelected(option);
    setShowFeedback(true);
    const correct = option === questions[current].answer;
    if (correct) setScore((s) => s + 1);
    setAnswers((a) => [...a, { ...questions[current], correct, given: option }]);
  }

  function nextQuestion() {
    if (current + 1 >= questions.length) { setMode("result"); }
    else { setCurrent((c) => c + 1); setSelected(null); setShowFeedback(false); setTypedAnswer(""); setAiFeedback(null); }
  }

  async function submitTyped() {
    if (!typedAnswer.trim() || loadingAI) return;
    setLoadingAI(true);
    const q = questions[current];
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: `You are a concise medical education tutor assessing a student's answer about nerve supply to muscles. Be encouraging but clinically accurate. Respond ONLY in this exact JSON format with no markdown backticks or preamble: {"correct": true or false, "score": integer 0-10, "feedback": "2-3 sentence explanation", "tip": "one memorable clinical pearl or mnemonic"}`,
          messages: [{ role: "user", content: `Muscle: ${q.muscle}\nCorrect answer: ${q.answer}\nStudent's answer: ${typedAnswer}\nAssess the student's answer.` }],
        }),
      });
      const data = await res.json();
      const text = data.content.map((c) => c.text || "").join("");
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setAiFeedback(parsed);
      const isCorrect = parsed.correct || parsed.score >= 7;
      if (isCorrect) setScore((s) => s + 1);
      setAnswers((a) => [...a, { ...q, correct: isCorrect, given: typedAnswer }]);
      setShowFeedback(true);
    } catch (e) {
      setAiFeedback({ feedback: "Could not reach AI — you may be offline. Correct answer: " + q.answer, correct: false, score: 0, tip: "" });
      setAnswers((a) => [...a, { ...q, correct: false, given: typedAnswer }]);
      setShowFeedback(true);
    }
    setLoadingAI(false);
  }

  const q = questions[current];
  const color = q ? (regionColors[q.region] || "#7EB8C9") : "#7EB8C9";
  const pct = questions.length ? Math.round((current / questions.length) * 100) : 0;

  if (mode === "home") return (
    <div style={{ background: "#0F1117", minHeight: "100%", color: "#E8ECF0", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ fontSize: 48, marginBottom: 10 }}>🧬</div>
      <h1 style={{ fontSize: 26, fontWeight: 900, margin: "0 0 6px", letterSpacing: "-0.03em", textAlign: "center" }}>Nerve Supply Quiz</h1>
      <p style={{ color: "#7A8BAA", fontSize: 13, textAlign: "center", margin: "0 0 36px", maxWidth: 280, lineHeight: 1.6 }}>10 questions · All body regions · Two modes</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%", maxWidth: 320 }}>
        <button onClick={() => startQuiz("mcq")} style={{ background: "linear-gradient(135deg, #9B89C4, #6B5A9E)", border: "none", borderRadius: 14, padding: "16px 18px", color: "#FFF", fontSize: 14, fontWeight: 700, cursor: "pointer", textAlign: "left" }}>
          <div>⚡ Multiple Choice</div>
          <div style={{ fontSize: 11, fontWeight: 400, opacity: 0.8, marginTop: 3 }}>4 options — pick the correct nerve supply</div>
        </button>
        <button onClick={() => startQuiz("typed")} style={{ background: "linear-gradient(135deg, #7EB8C9, #4A8FA3)", border: "none", borderRadius: 14, padding: "16px 18px", color: "#FFF", fontSize: 14, fontWeight: 700, cursor: "pointer", textAlign: "left" }}>
          <div>🤖 AI-Graded Free Text</div>
          <div style={{ fontSize: 11, fontWeight: 400, opacity: 0.8, marginTop: 3 }}>Type your answer — Claude grades and explains</div>
        </button>
      </div>
      <p style={{ marginTop: 28, fontSize: 10, color: "#3A4155" }}>Cross-referenced with Gray's Anatomy</p>
    </div>
  );

  if (mode === "result") {
    const pctScore = Math.round((score / questions.length) * 100);
    const grade = pctScore >= 80 ? "Excellent! 🏆" : pctScore >= 60 ? "Good work 👍" : "Keep revising 📚";
    const gradeColor = pctScore >= 80 ? "#85C18A" : pctScore >= 60 ? "#E8A87C" : "#E88080";
    return (
      <div style={{ background: "#0F1117", minHeight: "100%", color: "#E8ECF0", padding: 20 }}>
        <div style={{ textAlign: "center", padding: "24px 0 18px" }}>
          <div style={{ fontSize: 48, marginBottom: 6 }}>{pctScore >= 80 ? "🏆" : pctScore >= 60 ? "👍" : "📚"}</div>
          <div style={{ fontSize: 40, fontWeight: 900, color: gradeColor }}>{score}/{questions.length}</div>
          <div style={{ fontSize: 15, fontWeight: 700, color: gradeColor, marginTop: 3 }}>{grade}</div>
          <div style={{ fontSize: 12, color: "#7A8BAA", marginTop: 4 }}>{pctScore}% correct</div>
        </div>
        <div style={{ background: "#1A1D27", borderRadius: 12, overflow: "hidden", marginBottom: 18 }}>
          {answers.map((a, i) => (
            <div key={i} style={{ padding: "11px 14px", borderBottom: i < answers.length - 1 ? "1px solid #2A2E45" : "none", display: "flex", alignItems: "flex-start", gap: 9 }}>
              <span style={{ fontSize: 14, flexShrink: 0, marginTop: 1 }}>{a.correct ? "✅" : "❌"}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#FFF" }}>{a.muscle}</div>
                <div style={{ fontSize: 10, color: "#85C18A", marginTop: 2 }}>✓ {a.answer}</div>
                {!a.correct && <div style={{ fontSize: 10, color: "#E88080", marginTop: 1 }}>✗ {a.given}</div>}
              </div>
              <span style={{ fontSize: 9, color: regionColors[a.region] || "#7A8BAA", background: `${regionColors[a.region] || "#7A8BAA"}22`, padding: "2px 7px", borderRadius: 10, flexShrink: 0 }}>{a.region}</span>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={() => setMode("home")} style={{ flex: 1, background: "#1A1D27", border: "1px solid #2A2E45", borderRadius: 12, padding: 13, color: "#C0CAD8", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>← Home</button>
          <button onClick={() => startQuiz("mcq")} style={{ flex: 1, background: "linear-gradient(135deg, #9B89C4, #6B5A9E)", border: "none", borderRadius: 12, padding: 13, color: "#FFF", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Retry MCQ ↺</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: "#0F1117", minHeight: "100%", color: "#E8ECF0", display: "flex", flexDirection: "column" }}>
      <div style={{ height: 3, background: "#1A1D27" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: color, transition: "width 0.4s ease" }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 18px" }}>
        <button onClick={() => setMode("home")} style={{ background: "none", border: "none", color: "#7A8BAA", fontSize: 18, cursor: "pointer", padding: 0 }}>←</button>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#7A8BAA" }}><span style={{ color: "#FFF" }}>{current + 1}</span> / {questions.length}</div>
        <div style={{ fontSize: 12, color: "#85C18A", fontWeight: 700 }}>✓ {score}</div>
      </div>

      <div style={{ padding: "4px 18px 20px", flex: 1, display: "flex", flexDirection: "column" }}>
        <div style={{ background: "#1A1D27", borderRadius: 14, padding: "18px", marginBottom: 16, border: `1px solid ${color}44` }}>
          <div style={{ fontSize: 10, letterSpacing: "0.14em", color: color, textTransform: "uppercase", marginBottom: 6 }}>{q.region}</div>
          <div style={{ fontSize: 11, color: "#7A8BAA", marginBottom: 4 }}>Nerve supply of:</div>
          <div style={{ fontSize: 24, fontWeight: 900, color: "#FFF", letterSpacing: "-0.02em" }}>{q.muscle}</div>
        </div>

        {mode === "mcq" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {q.options.map((opt, i) => {
              let bg = "#1A1D27", border = "#2A2E45", textColor = "#C0CAD8";
              if (showFeedback) {
                if (opt === q.answer) { bg = "#85C18A22"; border = "#85C18A"; textColor = "#85C18A"; }
                else if (opt === selected && opt !== q.answer) { bg = "#E8808022"; border = "#E88080"; textColor = "#E88080"; }
              } else if (selected === opt) { bg = `${color}22`; border = color; textColor = "#FFF"; }
              return (
                <button key={i} onClick={() => handleMCQ(opt)} style={{ background: bg, border: `2px solid ${border}`, borderRadius: 11, padding: "12px 14px", color: textColor, fontSize: 12, fontWeight: showFeedback && opt === q.answer ? 700 : 500, cursor: "pointer", textAlign: "left", transition: "all 0.15s" }}>
                  <span style={{ opacity: 0.5, marginRight: 9, fontSize: 10 }}>{["A","B","C","D"][i]}</span>{opt}
                </button>
              );
            })}
          </div>
        )}

        {mode === "typed" && (
          <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
            <textarea
              value={typedAnswer}
              onChange={(e) => setTypedAnswer(e.target.value)}
              disabled={showFeedback}
              placeholder="e.g. Radial nerve (C5–C8)..."
              style={{ width: "100%", background: "#1A1D27", border: `2px solid ${showFeedback ? "#2A2E45" : color}`, borderRadius: 12, padding: 13, color: "#E8ECF0", fontSize: 13, resize: "none", height: 86, outline: "none", boxSizing: "border-box", fontFamily: "inherit" }}
            />
            {!showFeedback && (
              <button onClick={submitTyped} disabled={loadingAI || !typedAnswer.trim()} style={{ marginTop: 10, background: loadingAI ? "#2A2E45" : `linear-gradient(135deg, ${color}, #4A8FA3)`, border: "none", borderRadius: 12, padding: 13, color: "#FFF", fontSize: 14, fontWeight: 700, cursor: loadingAI ? "default" : "pointer" }}>
                {loadingAI ? "⏳ AI grading..." : "Submit Answer →"}
              </button>
            )}
            {showFeedback && aiFeedback && (
              <div style={{ marginTop: 12, background: (aiFeedback.correct || aiFeedback.score >= 7) ? "#85C18A11" : "#E8808011", border: `1px solid ${(aiFeedback.correct || aiFeedback.score >= 7) ? "#85C18A" : "#E88080"}55`, borderRadius: 12, padding: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: (aiFeedback.correct || aiFeedback.score >= 7) ? "#85C18A" : "#E88080" }}>
                    {(aiFeedback.correct || aiFeedback.score >= 7) ? "✅ Correct!" : "❌ Not quite"}
                  </span>
                  <span style={{ fontSize: 11, color: "#7A8BAA" }}>Score: {aiFeedback.score}/10</span>
                </div>
                <p style={{ margin: "0 0 10px", fontSize: 12, color: "#C0CAD8", lineHeight: 1.6 }}>{aiFeedback.feedback}</p>
                {aiFeedback.tip && (
                  <div style={{ background: "#0F1117", borderRadius: 8, padding: "9px 11px", borderLeft: `3px solid ${color}` }}>
                    <div style={{ fontSize: 9, color: color, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 3 }}>💡 CLINICAL PEARL</div>
                    <div style={{ fontSize: 11, color: "#C0CAD8" }}>{aiFeedback.tip}</div>
                  </div>
                )}
                <div style={{ marginTop: 9, fontSize: 11, color: "#85C18A" }}><strong>Correct answer:</strong> {q.answer}</div>
              </div>
            )}
          </div>
        )}

        {showFeedback && (
          <button onClick={nextQuestion} style={{ marginTop: 14, background: `linear-gradient(135deg, ${color}CC, ${color}88)`, border: "none", borderRadius: 12, padding: 13, color: "#FFF", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
            {current + 1 >= questions.length ? "See Results 🏁" : "Next Question →"}
          </button>
        )}
      </div>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────

const NAV = [
  { id: "atlas", label: "Atlas", icon: "🗺️" },
  { id: "quiz",  label: "Quiz",  icon: "🧬" },
];

export default function App() {
  const [tab, setTab] = useState("atlas");

  return (
    <div style={{ fontFamily: "'Segoe UI', system-ui, sans-serif", background: "#0F1117", display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
      <div style={{ flex: 1, overflowY: "auto" }}>
        {tab === "atlas" ? <Atlas /> : <Quiz />}
      </div>
      <div style={{ display: "flex", background: "#13161F", borderTop: "1px solid #2A2E45", flexShrink: 0 }}>
        {NAV.map((n) => {
          const active = tab === n.id;
          return (
            <button
              key={n.id}
              onClick={() => setTab(n.id)}
              style={{
                flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                gap: 3, padding: "10px 0 12px", background: "none", border: "none", cursor: "pointer",
                color: active ? "#9B89C4" : "#4A5568", transition: "color 0.2s",
              }}
            >
              <span style={{ fontSize: 20 }}>{n.icon}</span>
              <span style={{ fontSize: 10, fontWeight: active ? 700 : 500, letterSpacing: "0.05em" }}>{n.label}</span>
              {active && <div style={{ width: 20, height: 2, borderRadius: 1, background: "#9B89C4", marginTop: 1 }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
// ─── SERVICE WORKER (inline blob) ────────────────────────────────────────────
const SW_CODE = `
const CACHE = 'muscle-atlas-v1';
const ASSETS = self.location.href.replace('/sw-blob', '');

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => c.add(ASSETS)).then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', e => {
  // For API calls — always network (don't cache)
  if (e.request.url.includes('api.anthropic.com') || e.request.url.includes('unpkg.com') || e.request.url.includes('babel')) {
    e.respondWith(fetch(e.request).catch(() => new Response('', { status: 503 })));
    return;
  }
  // For the app shell — cache-first
  e.respondWith(
    caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
      if (res.ok) {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return res;
    }))
  );
});
`;

if ('serviceWorker' in navigator) {
  const blob = new Blob([SW_CODE], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, { scope: './' })
    .then(reg => console.log('[PWA] SW registered', reg.scope))
    .catch(err => console.warn('[PWA] SW failed (expected on file://)', err));
}

// ─── INSTALL PROMPT (Android/Chrome) ─────────────────────────────────────────
let deferredPrompt = null;
const banner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const dismissBtn = document.getElementById('dismiss-btn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Only show if not already installed / dismissed
  if (!localStorage.getItem('pwa-dismissed')) {
    setTimeout(() => banner.classList.add('visible'), 1500);
  }
});

installBtn.addEventListener('click', async () => {
  banner.classList.remove('visible');
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('[PWA] Install outcome:', outcome);
    deferredPrompt = null;
  }
});

dismissBtn.addEventListener('click', () => {
  banner.classList.remove('visible');
  localStorage.setItem('pwa-dismissed', '1');
});

window.addEventListener('appinstalled', () => {
  banner.classList.remove('visible');
  deferredPrompt = null;
});

// ─── iOS "Add to Home Screen" hint ────────────────────────────────────────────
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

const iosHint = document.getElementById('ios-hint');
const closeIosHint = document.getElementById('close-ios-hint');

if (isIOS() && !isStandalone() && !localStorage.getItem('ios-hint-dismissed')) {
  setTimeout(() => iosHint.classList.add('visible'), 3000);
}

closeIosHint.addEventListener('click', () => {
  iosHint.classList.remove('visible');
  localStorage.setItem('ios-hint-dismissed', '1');
});

// ─── OFFLINE / ONLINE TOASTS ──────────────────────────────────────────────────
function showToast(id, duration = 3000) {
  const el = document.getElementById(id);
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), duration);
}

window.addEventListener('offline', () => showToast('offline-toast', 4000));
window.addEventListener('online',  () => showToast('online-toast', 2500));
</script>
